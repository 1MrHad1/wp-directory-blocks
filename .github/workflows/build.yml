name: Build

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Lint JavaScript
              run: npm run lint:js

            - name: Lint styles
              run: npm run lint:css

            - name: Build
              run: npm run build

            - name: Fail if the build produced nothing
              run: test -f build/directory/index.js && test -f build/spec-card/index.js
